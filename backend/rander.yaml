databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_user

services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: FRONTEND_URL
        value: "*"
    healthCheckPath: /api/health